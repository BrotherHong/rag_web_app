user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip 壓縮
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json;

    # 上游後端服務
    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        client_max_body_size 50M;  # 單檔 10MB，保留多檔空間

        absolute_redirect off;

        # 安全標頭
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none';" always;

        # 根路徑：ADFS callback 帶 ?code= 時轉給後端處理，否則重導至 /query
        location = / {
            if ($arg_code != "") {
                return 302 /api/query-auth/portal-callback?$query_string;
            }
            return 301 /query;
        }

        # Admin Portal (靜態檔案)
        location /admin/ {
            alias /usr/share/nginx/html/admin/;
            try_files $uri $uri/ /admin/index.html;
            index index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }
        
        location = /admin {
            return 301 /admin/;
        }

        # Query Portal (靜態檔案)
        location /query/ {
            alias /usr/share/nginx/html/query/;
            try_files $uri $uri/ /query/index.html;
            index index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }
        
        location = /query {
            return 301 /query/;
        }

        # Backend API (反向代理)
        location /api {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            
            # 標頭傳遞
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 超時設定
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # 緩衝設定
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            

        }

        # Swagger UI / ReDoc 已關閉（生產環境）

        # 健康檢查端點
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # 404 錯誤處理
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        # 50x 錯誤處理
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
        }
    }
}
